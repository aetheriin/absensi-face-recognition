<!DOCTYPE html>
<html>
<head>
    <title>Preview Overlay Absensi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "IBM Plex Sans", sans-serif;
            background: #1a1a1a;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .kios {
            width: 480px;
            height: 640px;
            background: #000;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        .kamera-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 0.9rem;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            transition: opacity 0.3s ease;
        }

        .overlay.tampil {
            display: flex;
        }

        .overlay.berhasil {
            background: rgba(35, 61, 44, 0.96);
        }

        .overlay.gagal {
            background: rgba(168, 67, 42, 0.96);
        }

        .overlay .ikon {
            font-size: 4rem;
            color: #fff;
            margin-bottom: 1rem;
        }

        .overlay .nama {
            font-family: "Zilla Slab", serif;
            font-size: 2.2rem;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .overlay .status {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.85);
            margin-bottom: 0.3rem;
        }

        .overlay .jam {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.7);
        }

        .kontrol-demo {
            position: fixed;
            bottom: 2rem;
            display: flex;
            gap: 1rem;
        }

        .kontrol-demo button {
            padding: 0.7rem 1.4rem;
            border: none;
            border-radius: 4px;
            font-family: "IBM Plex Sans", sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .btn-berhasil { background: #4E7A52; color: #fff; }
        .btn-gagal { background: #A8432A; color: #fff; }
        .btn-reset { background: #444; color: #fff; }
    </style>
</head>
<body>

    <div class="kios">
        <div class="kamera-placeholder">[ Tampilan kamera langsung di sini ]</div>

        <div class="overlay berhasil" id="overlayBerhasil">
            <div class="ikon">✓</div>
            <div class="nama">Rifki</div>
            <div class="status">Absen Masuk Berhasil</div>
            <div class="jam">08:14:32 &middot; 08 September 2026</div>
        </div>

        <div class="overlay gagal" id="overlayGagal">
            <div class="ikon">✕</div>
            <div class="nama">Wajah Tidak Dikenali</div>
            <div class="status">Silakan coba lagi atau hubungi HRD</div>
        </div>
    </div>

    <div class="kontrol-demo">
        <button class="btn-berhasil" onclick="tampilkan('overlayBerhasil')">Simulasi: Berhasil</button>
        <button class="btn-gagal" onclick="tampilkan('overlayGagal')">Simulasi: Gagal</button>
        <button class="btn-reset" onclick="reset()">Reset</button>
    </div>

    <script>
        function tampilkan(id) {
            reset();
            const el = document.getElementById(id);
            el.classList.add('tampil');
            setTimeout(() => {
                el.classList.remove('tampil');
            }, 3000);
        }

        function reset() {
            document.getElementById('overlayBerhasil').classList.remove('tampil');
            document.getElementById('overlayGagal').classList.remove('tampil');
        }
    </script>

</body>
</html>
